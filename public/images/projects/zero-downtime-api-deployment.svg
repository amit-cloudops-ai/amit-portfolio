<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Blue-green and canary API deployment</title><desc id="desc">API Gateway stages and canary traffic distribution, with CloudWatch alarms and an operator-driven rollback.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8D8983"/></marker>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#24211F}.eyebrow{font-size:16px;letter-spacing:3px;fill:#8B817A;font-weight:700}.heading{font-size:34px;font-weight:700;letter-spacing:-1.2px}.sub{font-size:18px;fill:#6F6964}.box{fill:#fff;stroke:#D8D2CB;stroke-width:2}.cloud{fill:#F0EAE3;stroke:#CFC3B7;stroke-width:2}.accent{fill:#A83B2B;stroke:#A83B2B}.accentText{fill:#fff}.green{fill:#E8F1E9;stroke:#9EB6A2;stroke-width:2}.line{fill:none;stroke:#8D8983;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#B7AFA7;stroke-width:2;stroke-dasharray:8 8}.small{font-size:16px;fill:#6F6964}.label{font-size:21px;font-weight:700}.tiny{font-size:14px;fill:#756E68}
 </style>
</defs>
<rect width="1200" height="760" fill="#F7F7F5"/>
<text x="64" y="58" class="eyebrow">AMIT MADAKATTI / ENGINEERING CASE STUDY</text>
<text x="64" y="112" class="heading">Blue-green and canary API deployment</text>
<text x="64" y="146" class="sub">API Gateway stages and canary traffic distribution, with CloudWatch alarms and an operator-driven rollback.</text>

<rect x="70" y="205" width="1060" height="420" rx="22" class="dash"/>
<text x="96" y="240" class="eyebrow">AWS / API GATEWAY REST API · REGION us-east-1</text>
<rect x="100" y="330" width="200" height="90" rx="14" class="cloud"/><text x="200" y="366" text-anchor="middle" class="label">API Gateway</text><text x="200" y="394" text-anchor="middle" class="small">/hello · REST API</text>
<rect x="390" y="270" width="205" height="95" rx="14" class="green"/><text x="492" y="306" text-anchor="middle" class="label">Production stage</text><text x="492" y="334" text-anchor="middle" class="small">Blue + 10% canary</text>
<rect x="390" y="430" width="205" height="95" rx="14" class="box"/><text x="492" y="466" text-anchor="middle" class="label">Staging stage</text><text x="492" y="494" text-anchor="middle" class="small">Green validation</text>
<path d="M300 370 H350 V318 H385" class="line"/><path d="M350 370 V478 H385" class="line"/>
<rect x="690" y="270" width="170" height="95" rx="14" class="box"/><text x="775" y="306" text-anchor="middle" class="label">Blue Lambda</text><text x="775" y="334" text-anchor="middle" class="small">v1 stable</text>
<rect x="690" y="430" width="170" height="95" rx="14" class="accent"/><text x="775" y="466" text-anchor="middle" class="label accentText">Green Lambda</text><text x="775" y="494" text-anchor="middle" class="small accentText">v2 candidate</text>
<path d="M595 318 H685" class="line"/><path d="M595 478 H685" class="line"/>
<rect x="940" y="270" width="155" height="95" rx="14" class="green"/><text x="1017" y="306" text-anchor="middle" class="label">CloudWatch</text><text x="1017" y="334" text-anchor="middle" class="small">4xx / 5xx alarms</text>
<rect x="940" y="430" width="155" height="95" rx="14" class="box"/><text x="1017" y="466" text-anchor="middle" class="label">SNS</text><text x="1017" y="494" text-anchor="middle" class="small">Email notification</text>
<path d="M860 318 H935" class="line"/><path d="M1017 365 V425" class="line"/>
<text x="100" y="570" class="small">Rollback documented as an operator action: set canary to 0%, then redeploy production.</text>
<text x="100" y="598" class="small">No automated alarm-triggered rollback is evidenced in the repository.</text>

